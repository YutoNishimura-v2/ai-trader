extends: ../default.yaml

# GOLD iter32: cap=7, 0/4, Mar -22.63%, full -38% — **do not use** (M1 bias off).

# Iter186 — Wave R: `zigzag_fib_mtf` — **`require_m1_bias_match: false`** so M1
# may confirm a fib pullback even when M1 ZigZag trend label disagrees with M5
# (still requires M5 fib touch + M1 fib overlap + rejection candle).

risk:
  risk_per_trade_pct: 2.0

instrument:
  timeframe: M1

strategy:
  __replace__: true
  name: zigzag_fib_mtf
  params:
    __replace__: true
    htf: M5
    zigzag_threshold_atr: 1.2
    zigzag_atr_period: 14
    atr_period_m1: 14
    fib_touch_atr: 0.45
    sl_atr_buffer: 0.35
    tp1_rr: 1.0
    tp2_rr: 2.5
    leg1_weight: 0.55
    cooldown_bars: 8
    session: always
    require_m1_bias_match: false
