# Wave X — iter212 — HTF pullback proxy: M1 ZigZag may be flat; 24h session; looser RCI.
#
# Harness (data/xauusd_m1_2026.csv, 2026-05-14): full ~+4.3%, PF ~1.08, cap=0, 2/4 wins
# (matches baseline count) but worst_score ~1.33 vs rollwin ~0.10; Mar ~-3.41%, Apr ~+15.81%.
extends: _base_moonshot_m1.yaml

instrument:
  timeframe: M1

strategy:
  __replace__: true
  name: wave_structure_mtf
  params:
    htf: H1
    m1_bias_mode: not_opposed
    htf_zigzag_threshold_atr: 1.25
    m1_zigzag_threshold_atr: 0.85
    fib_entry_min: 0.382
    fib_entry_max: 0.50
    sl_fib_from_extreme: 0.236
    sr_touch_atr: 1.2
    rci_long_min_prev: -8.0
    rci_short_max_prev: 8.0
    tp1_rr: 0.8
    tp2_rr: 2.4
    cooldown_bars: 5
    session: always

risk:
  risk_per_trade_pct: 6.0
