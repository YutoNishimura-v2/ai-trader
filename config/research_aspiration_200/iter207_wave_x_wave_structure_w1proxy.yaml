# Wave X — iter207 — "Wave 1 only" proxy: first 3000 M1 bars (~2d) after HTF bias activates.
#
# Harness (data/xauusd_m1_2026.csv, 2026-05-14): same as iter205 on this slice (full ~+6.1%, 0/4 wins).
extends: _base_moonshot_m1.yaml

instrument:
  timeframe: M1

strategy:
  __replace__: true
  name: wave_structure_mtf
  params:
    htf: H1
    early_trend_bars: 3000
    late_trend_only: false
    htf_zigzag_threshold_atr: 1.25
    m1_zigzag_threshold_atr: 0.85
    fib_entry_min: 0.382
    fib_entry_max: 0.50
    sl_fib_from_extreme: 0.236
    sr_touch_atr: 0.75
    rci_period: 14
    tp1_rr: 0.85
    tp2_rr: 2.6
    cooldown_bars: 8
    session: london_or_ny

risk:
  risk_per_trade_pct: 6.0
