# Wave X — iter211 — extension-only proxy: skip first 480 M1 bars (~8h) after HTF bias on.
#
# Harness (data/xauusd_m1_2026.csv, 2026-05-14): full ~+0.9%, PF ~1.59, cap=0, 0/4 wins,
# Mar%/Apr% nan (sparse), worst_score=-inf.
extends: _base_moonshot_m1.yaml

instrument:
  timeframe: M1

strategy:
  __replace__: true
  name: wave_structure_mtf
  params:
    htf: H1
    htf_zigzag_threshold_atr: 1.25
    m1_zigzag_threshold_atr: 0.85
    early_trend_bars: 480
    late_trend_only: true
    fib_entry_min: 0.382
    fib_entry_max: 0.50
    sl_fib_from_extreme: 0.236
    sr_touch_atr: 1.0
    rci_period: 14
    tp1_rr: 0.9
    tp2_rr: 2.8
    leg1_weight: 0.5
    cooldown_bars: 6
    session: london_or_ny

risk:
  risk_per_trade_pct: 6.0
